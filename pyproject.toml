[project]
authors = [{name = "Naiara Patiño", email = "naiarapatino@gmail.com"}]
dependencies = []
name = "diad-imaging"
requires-python = ">= 3.9"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE.txt"]

[project.optional-dependencies]
examples = []
docs = ["mkdocs-material"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64"]

[tool.pixi.pypi-dependencies]
diad_imaging = { path = ".", editable = true }
uvplot = "*"

[tool.pixi.tasks]
casa-x86 = { cmd = "casa", depends-on = [], env = { CONDA_SUBDIR = "osx-64" } }

[tool.pixi.dependencies]
python = "3.9.*"
cython = ">=3.0.11,<4"
ipython = ">=8.12.2,<9"
ipykernel = ">=6.29.5,<7"
astropy = ">=5.2.2,<6"
pandas = ">=2.0.3,<3"
pathlib = ">=1.0.1,<2"
casatools = "*"
casatasks = "*"

[tool.pixi.target.osx-64.dependencies]
galario = ">=1.2.2,<2"


